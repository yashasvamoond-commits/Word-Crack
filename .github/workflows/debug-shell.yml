name: Debug Shell Only

# TEMPORARY debugging workflow: exercises only the Gradle/Android shell with a fake web asset,
# skipping the ~10 minute WASM build. Removed once the main pipeline is green.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Stage a fake web site
        run: |
          mkdir -p /tmp/fake-dist
          cat > /tmp/fake-dist/index.html <<'HTML'
          <!doctype html><html><head><script type="module" src="./app.js"></script></head>
          <body><canvas id="wordcraft_canvas"></canvas></body></html>
          HTML
          echo 'export default {};' > /tmp/fake-dist/app.js
          echo '00' > /tmp/fake-dist/app_bg.wasm
          android/ci/copy_web_assets.sh /tmp/fake-dist

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace \
            -PwordcraftVersionName="debug-1" -PciRunNumber=1 -PwordcraftCommit=debug \
            2>&1 | tee "$RUNNER_TEMP/gradle.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "## Gradle build failure"
              echo '```'
              sed -n '/FAILURE: Build failed/,$p' "$RUNNER_TEMP/gradle.log" | head -220
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Validate APK contents
        if: success()
        working-directory: android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK" \
            | grep -E "package:|launchable-activity:|sdkVersion:|targetSdkVersion:"
          unzip -l "$APK" | grep -E "assets/web/index.html|assets/web/.*\.wasm|assets/web-bridge.js"
